name: gremlins

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  gremlins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0 # SHA: 9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@v6.5.0 # SHA: 924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27"
          cache: true
      - uses: go-gremlins/gremlins-action@v1.0.3 # SHA: e5dc59ad56bda9b70d8b64f9499c44d0fa318a08
        with:
          version: latest
          # Thresholds (efficacy/mcover) live in .gremlins.yaml at the repo
          # root, NOT as --threshold-* args: a gremlins/viper bug binds float
          # CLI flags as strings, so they are silently ignored by assess() and
          # the build would never fail even at 100% surviving mutants. The
          # config file is parsed as real floats and DOES gate the exit code
          # (the action fails the step on a non-zero exit).
          #   efficacy:99.99  -> clean 100% passes; any surviving mutant fails.
          #   mcover:75        -> current code passes (~82-91%) with margin.
          # The positional must be "." (not "./...") — gremlins v0.6.0 does not
          # expand "./..." and silently reports "No results to report".
          args: >-
            .
          workdir: .
