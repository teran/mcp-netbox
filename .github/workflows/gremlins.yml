name: gremlins

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  gremlins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1 # SHA: 9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@v7.0.0 # SHA: 924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27"
          cache: true
      # Mutation testing is a dedicated hard gate (C02/C08GO). CI binds to the
      # build-system interface (R07/N31): install gremlins (pinned) and call
      # `make mutation`, like every other quality gate, instead of running the
      # raw tool directly.
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Run mutation gate
        run: make mutation
