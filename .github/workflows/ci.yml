name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0 # SHA: 9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2.3.7 # SHA: 83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3

      - name: Setup Go
        uses: actions/setup-go@v6.5.0 # SHA: 924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "stable"
          cache: true

      - name: govulncheck
        uses: golang/govulncheck-action@v1.1.0 # SHA: 032d45514ae346b1db93c04b0c90b841c370344f
        with:
          go-version-input: "stable"
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0 # SHA: ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: latest
          args: --config .golangci.yml

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -count=1 ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | sed 's/%//')
          echo "### Coverage: ${COVERAGE}% (threshold: 85%)" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage: ${COVERAGE}%"
          THRESHOLD=85
          if awk "BEGIN {exit !($COVERAGE < $THRESHOLD)}"; then
            echo "❌ Coverage ${COVERAGE}% is below threshold of ${THRESHOLD}%"
            echo "❌ Coverage ${COVERAGE}% is below threshold of ${THRESHOLD}%" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold of ${THRESHOLD}%"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7.0.1 # SHA: 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
