name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - "**"

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0 # SHA: 9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v3.0.0 # SHA: 83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v7.0.0 # SHA: 924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27"
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      # `make lint` runs golangci-lint + gosec + govulncheck + go-arch-lint.
      # govulncheck is folded into the make interface (lint-vuln sub-target)
      # rather than a separate GitHub action, so all static analysis lives
      # behind a single `make <target>` entry point (R07).
      - name: Lint (golangci + gosec + govulncheck + arch)
        run: make lint

      # `make test` runs the race-enabled unit suite and enforces the >=95%
      # coverage gate internally (R07), producing coverage.out for upload.
      - name: Test with coverage gate
        run: make test

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7.0.1 # SHA: 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # The e2e suite spins up a real NetBox via go-docker-testsuite, so it needs a
  # Docker-capable runner and is gated behind the `e2e` build tag (excluded from
  # the default unit run) plus the MCP_NETBOX_E2E=1 runtime guard. It is driven
  # through `make e2e` (R07).
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0 # SHA: 9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7.0.0 # SHA: 924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27"
          cache: true

      - name: Run e2e tests
        env:
          MCP_NETBOX_E2E: "1"
        run: make e2e
