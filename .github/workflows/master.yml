name: Master

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0 # SHA: 9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6.5.0 # SHA: 924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27"
          cache: true

      - name: Setup GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@latest

      # `make build` produces the unified dist/ artifact via goreleaser
      # (snapshot mode is the default) (R07).
      - name: Build dist artifact
        run: make build

      - name: Generate image tags
        id: meta
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          SHORTCOMMIT=$(git rev-parse --short HEAD)
          IMAGE=ghcr.io/${{ github.repository }}
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:master-${SHORTCOMMIT} ${IMAGE}:master-${TIMESTAMP} ${IMAGE}:master-${SHORTCOMMIT}-${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0 # SHA: af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0 # SHA: bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      # `make container-image push=true` builds the image from the dist/
      # artifact produced by `make build` and pushes it (R07).
      - name: Build and push Docker image
        run: make container-image push=true
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
