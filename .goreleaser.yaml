version: 2

project_name: mcp-netbox

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.appName=mcp-netbox -X main.appVersion={{ .Version }} -X main.appCommitHash={{ .Commit }} -X main.appTimestamp={{ .Date }}
    binary: mcp-netbox

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - SPEC.md
      - AGENTS.md

checksum:
  name_template: "checksums.txt"

snapshot:
  # Non-tag/master builds MUST embed a SNAPSHOT version identifying the commit
  # (B02/N43): "{X}-SNAPSHOT-{commit}". goreleaser's `.ShortCommit` provides the
  # abbreviated commit hash in snapshot mode.
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: teran
    name: mcp-netbox
  draft: false
